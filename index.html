<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدرس السادس: تطبيقات التخزين السحابي - منصة محترف</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,'Segoe UI',sans-serif;font-size:20px;color:#1d2b53;min-height:100vh;background:linear-gradient(135deg,#bfe9ff,#e6d6ff,#ffe9b8,#c9f7e0);background-size:400% 400%;animation:g 14s ease infinite;overflow-x:hidden}
@keyframes g{50%{background-position:100% 50%}}
.fl{position:fixed;bottom:-60px;font-size:36px;opacity:.5;animation:up linear infinite;z-index:0;pointer-events:none}@keyframes up{to{transform:translateY(-115vh) rotate(40deg)}}
header{position:relative;z-index:1;display:flex;align-items:center;gap:12px;background:#fff;padding:8px 16px;box-shadow:0 3px 12px #0002}header img{height:70px;border-radius:12px}header b{font-size:22px;color:#2f6fc4}
main{position:relative;z-index:1;max-width:820px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 6px 18px #0002;margin-bottom:16px;text-align:center}
h1{font-size:28px;margin:0 0 8px}h2{font-size:25px;line-height:1.7}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:14px 18px;transition:.2s}button:hover:not(:disabled){transform:scale(1.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.lv{color:#fff;display:flex;flex-direction:column;gap:4px;align-items:center;box-shadow:0 5px 0 #0003}.lv b{font-size:52px}.lv small{font-size:18px}.lv em{font-style:normal}
.c0{background:#3b9cf0}.c1{background:#ff9f43}.c2{background:#2ec27e}
.exam{width:100%;background:#ef476f;color:#fff;font-size:26px;font-weight:700;box-shadow:0 5px 0 #0003}
.big{font-size:80px}.cd p{font-size:24px;line-height:1.9;margin:8px 0}
.dots span{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ccd;margin:3px}.dots .on{background:#3b9cf0}
.go{background:#3b9cf0;color:#fff;margin:6px}.back{background:#e5e8f0;margin:6px}
.bar{height:14px;background:#e5e8f0;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2ec27e,#3b9cf0);transition:.4s}.cnt{font-size:18px}
.opts{display:grid;gap:10px}.opts.tf{grid-template-columns:1fr 1fr}.opts button{background:#f0f4ff;text-align:right;font-size:21px;border:3px solid #d7e0ff;display:flex;gap:10px;align-items:center}.opts.tf button{justify-content:center;font-size:26px}
.opts b{background:#3b9cf0;color:#fff;border-radius:50%;min-width:34px;height:34px;display:grid;place-items:center;font-size:18px}
.opts .ok{background:#c9f7d9!important;border-color:#2ec27e!important}.opts .no{background:#ffd6dc!important;border-color:#ef476f!important}
.msg{margin:14px 0;padding:12px;border-radius:14px;font-weight:700}.g{background:#c9f7d9}.b{background:#ffd6dc}
.next{background:#2ec27e;color:#fff;font-size:22px}
input{font:inherit;font-size:24px;padding:12px;border:3px solid #3b9cf0;border-radius:14px;width:90%;text-align:center;margin:12px 0}
.rv{text-align:right;font-size:18px;background:#fff6e0;border-radius:12px;padding:8px 12px;margin:6px 0}
.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;padding:14px 22px;border-radius:18px;font-weight:700;margin:8px}
.fx{position:fixed;top:-40px;font-size:34px;animation:f 1.8s linear forwards;z-index:9;pointer-events:none}@keyframes f{to{transform:translateY(112vh) rotate(360deg)}}
</style></head><body>
